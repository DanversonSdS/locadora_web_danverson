<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes cadastrados</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="cabecalho">
    <p class="aluno">Aluno Danverson</p>
    <h1>Locadora Danverson</h1>
    <p>Filmes cadastrados</p>
</header>
<main class="conteudo">
    <section class="painel-listagem">

        <div class="cabecalho-pagina">
            <h2>Lista de filmes</h2>
            <a class="botao-principal" th:href="@{/filmes/novo}">
                Cadastrar novo filme
            </a>
        </div>

        <p class="mensagem-sucesso" th:if="${param.sucesso}">
            Filme cadastrado com sucesso
        </p>

        <p class="lista-vazia" th:if="${filmes.isEmpty()}">
            Nenhum filme cadastrado
        </p>

        <div class="tabela-container" th:if="${!filmes.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>Gênero</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="filme : ${filmes}">
                    <td th:text="${filme.codigo}">1</td>
                    <td th:text="${filme.nome}">Matrix</td>
                    <td th:text="${filme.genero}">Ficção</td>
                    <td>
                            <span th:if="${filme.alugado}" class="status-alugado">
                                Alugado
                            </span>
                        <span th:unless="${filme.alugado}" class="status-disponivel">
                                Disponível
                            </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="acoes">
            <a class="botao-secundario" th:href="@{/}">
                Voltar ao menu
            </a>
        </div>

    </section>
</main><footer class="rodape">
    <p>Projeto de Programação Orientada a objetos I</p>
</footer>
</body>
</html>
